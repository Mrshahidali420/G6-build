name: deploy

# Builds the site and uploads it straight to Cloudflare Pages.
# This replaces the Pages "connect to GitHub" button, which needs a browser
# OAuth click. Wrangler pushes dist/ over the API instead.
#
# Needs two repo secrets:
#   CLOUDFLARE_API_TOKEN   - a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - 735d0fbab0757142b2c29917563e0626

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lesson 6: npm install, not npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Upload to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gta6record --branch=main
      # IndexNow manifest (url -> content hash), so only pages that actually
      # changed get resubmitted. The primary key includes the run id so this
      # run always saves a fresh cache entry at the end of the job (actions/
      # cache does this automatically); restore-keys falls back to the most
      # recent manifest from any prior run since no run id will ever match.
      - name: Restore IndexNow manifest
        uses: actions/cache@v4
        with:
          path: .indexnow-manifest.json
          key: indexnow-manifest-${{ github.run_id }}
          restore-keys: |
            indexnow-manifest-
      - name: Notify IndexNow of changed URLs
        run: node scripts/indexnow.mjs
