name: robot

# The self running record. Twice a day it reads the press and official feeds
# and the Rockstar Newswire, saves what those outlets published, and turns it
# into two kinds of output.
#
# Lane 1 writes a dated coverage log. It cannot form a sentence: everything on
# those pages is either quoted verbatim or built from a template holding a
# date, an outlet name and a count.
#
# Lanes 2 and 3 run on plain logic first and always. With no AI key at all the
# robot still reads every saved article for sentences that name a catalog entry,
# appends them as dated facts, and writes quote digest news pages. A model, when
# a key works, is a bonus on top: extra claims, candidates for new catalog
# entries, and a written article in place of the digest. Nothing the model says
# is trusted. A claim is dropped unless its quote is a real run of characters
# from the saved article, and a new catalog entry is refused unless it clears
# every code check in scripts/robot/entities.mjs. See docs/ROBOT.md.
#
# The build is the gate. If npm run build fails, nothing is committed and
# nothing is pushed, so a bad page can never reach the site.

on:
  schedule:
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Optional YYYY-MM-DD. Re-read the feeds for anything published on or after this day, ignoring the seen list. Use it to recover a missed day.'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  # Lets the run call GitHub Models with its own GITHUB_TOKEN. No secret needed.
  models: read

jobs:
  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lesson 6: the lockfile is allowed to drift between the Windows machine
      # and this runner, so a failed ci falls back to install rather than
      # losing the run.
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # Only the Newswire lane needs a browser. If this step fails the Newswire
      # lane prints a line and skips itself, and the press lane still runs.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Chromium
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Gather the press feeds
        run: node scripts/robot/gather.mjs
        env:
          ROBOT_SINCE: ${{ inputs.since }}

      - name: Gather the Rockstar Newswire
        continue-on-error: true
        run: node scripts/robot/newswire.mjs

      # Lane 2, step one. Logic is the floor: with no key it still reads every
      # saved article for sentences naming a catalog entry. A key adds the
      # model's claims on top.
      - name: Read the saved articles for facts
        continue-on-error: true
        run: node scripts/robot/extract.mjs
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROBOT_AI: ${{ vars.ROBOT_AI }}
          ROBOT_MODEL_EXTRACT: ${{ vars.ROBOT_MODEL_EXTRACT }}

      # Lane 2, step two. Appending dated facts to entries that exist is pure
      # code and always runs. Only a new entry needs a model, so with no key
      # the candidates are held rather than refused.
      - name: Turn checked claims into catalog entries
        continue-on-error: true
        run: node scripts/robot/entities.mjs
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROBOT_AI: ${{ vars.ROBOT_AI }}
          ROBOT_MODEL_EXTRACT: ${{ vars.ROBOT_MODEL_EXTRACT }}
          ROBOT_MODEL_WRITE: ${{ vars.ROBOT_MODEL_WRITE }}

      # Lane 3. Groups the checked claims into stories and writes a page for a
      # story an official source, or two outlets, covered. Logic is the floor:
      # with no key, or when the model draft fails a check, the page is a quote
      # digest built from outlet headlines, summaries, dates and links, with
      # every fact inside a verbatim blockquote. With a key the model writes the
      # prose instead, and every sentence it wrote is put back to the model with
      # the quotes and deleted unless it is supported.
      - name: Write news articles
        continue-on-error: true
        run: node scripts/robot/news.mjs
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROBOT_AI: ${{ vars.ROBOT_AI }}
          ROBOT_MODEL_EXTRACT: ${{ vars.ROBOT_MODEL_EXTRACT }}
          ROBOT_MODEL_WRITE: ${{ vars.ROBOT_MODEL_WRITE }}

      - name: Write the coverage log
        run: node scripts/robot/publish.mjs

      # The gate. A page that does not build is a page that does not ship.
      - name: Build
        run: npm run build

      - name: Commit what was recorded
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/robot data/robot-entities.csv data/extras public/img/entities src/content/updates src/content/news; do [ -e "$p" ] && git add "$p"; done
          if git diff --cached --quiet; then
            echo "nothing new to record"
            exit 0
          fi
          git commit -m "chore(robot): record what was published"
          # A person can land a commit on main while this run is in flight, and
          # then the push is rejected with "fetch first" and a run's work is
          # lost. The robot only touches data and content paths, so replaying
          # its commit on top of whatever landed is safe.
          git pull --rebase origin main
          git push origin HEAD:main || {
            echo "push rejected, pulling once more"
            git pull --rebase origin main
            git push origin HEAD:main
          }

      # One issue per refused entity, so a person can finish what the checks
      # would not let the robot ship. data/robot/issued.json is the memory, so
      # the same refusal never opens a second issue.
      - name: Open an issue for each refusal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p data/robot/refused
          node -e '
            const fs = require("fs")
            let issued = []
            try { issued = JSON.parse(fs.readFileSync("data/robot/issued.json", "utf8")) } catch {}
            const files = fs.readdirSync("data/robot/refused").filter((f) => f.endsWith(".json"))
            const todo = files.map((f) => f.slice(0, -5)).filter((slug) => !issued.includes(slug))
            fs.writeFileSync("data/robot/_todo.txt", todo.join("\n"))
          '
          while read -r slug; do
            [ -z "$slug" ] && continue
            reason=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).reason' "data/robot/refused/$slug.json")
            gh issue create \
              --title "robot: $slug was refused" \
              --label robot \
              --body "The robot gathered enough sourced claims for a new \`$slug\` entry and then refused to publish it.

          Reason: $reason

          Everything it had is in \`data/robot/refused/$slug.json\`, including every claim and the exact words each one came from. A person can finish the entry from that file.

          This issue was opened by \`.github/workflows/robot.yml\`." || true
            node -e '
              const fs = require("fs")
              let issued = []
              try { issued = JSON.parse(fs.readFileSync("data/robot/issued.json", "utf8")) } catch {}
              issued.push(process.argv[1])
              fs.writeFileSync("data/robot/issued.json", JSON.stringify([...new Set(issued)].sort(), null, 2) + "\n")
            ' "$slug"
          done < data/robot/_todo.txt
          rm -f data/robot/_todo.txt
          # git diff exits 128 on a file git has never seen, which set -e turns
          # into a failed step even when there was nothing to do. status is quiet.
          if [ -n "$(git status --porcelain -- data/robot/issued.json)" ]; then
            git add data/robot/issued.json
            git commit -m "chore(robot): note which refusals have an issue"
            git pull --rebase origin main && git push origin HEAD:main
          fi
